# ContractIQ CI — docs/specs/00-foundation.md §12.5.
# The app lives in contractiq/; this repo root holds the docs.
# Branch protection on main should require: lint-type-unit, db-integration, e2e.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # nightly: Firefox + mobile E2E (evals run in eval-nightly.yml)

defaults:
  run:
    working-directory: contractiq

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Fake, non-secret values so `next build` and env validation pass. Real keys are never needed in CI
  # except OPENAI_API_KEY_EVAL for the live eval steps.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  OPENAI_API_KEY: sk-ci-not-a-real-key
  OPENAI_PRICE_INPUT_PER_MTOK: '2.5'
  OPENAI_PRICE_OUTPUT_PER_MTOK: '10'
  OPENAI_USER_HASH_SALT: ci-salt-ci-salt-ci-salt-ci-salt-ci-salt
  OPENAI_MONTHLY_BUDGET_USD: '400'
  INTERNAL_FUNCTION_SECRET: ci-internal-secret-ci-internal-secret-0

jobs:
  lint-type-unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-key-000000
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: contractiq/.nvmrc, cache: npm, cache-dependency-path: contractiq/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  db-integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: contractiq/.nvmrc, cache: npm, cache-dependency-path: contractiq/package-lock.json }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        # Keep equal to the `supabase` devDependency in package-lock.json: npm scripts (db:types) run that copy,
        # and `gen types` output changes between releases. To upgrade, bump both and re-run npm run db:types.
        with: { version: 2.120.0 }
      - run: supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor
      - name: Export local Supabase env
        run: |
          supabase status -o env >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - name: Map Supabase keys
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: RLS catalog check
        run: npm run db:verify-rls
        env: { DB_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' }
      - name: Database types are up to date
        run: npm run db:types && git diff --exit-code src/types/database.types.ts
      - run: npm run test:integration

  e2e:
    if: github.event_name != 'schedule'
    needs: [lint-type-unit, db-integration]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PROCESSING_MODE: sync
      OPENAI_BASE_URL: http://localhost:4010/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: contractiq/.nvmrc, cache: npm, cache-dependency-path: contractiq/package-lock.json }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        # Keep equal to the `supabase` devDependency in package-lock.json: npm scripts (db:types) run that copy,
        # and `gen types` output changes between releases. To upgrade, bump both and re-run npm run db:types.
        with: { version: 2.120.0 }
      - run: supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor
      - name: Export local Supabase env
        run: |
          supabase status -o env >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - name: Map Supabase keys
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: Start OpenAI mock server
        run: npx tsx tests/mocks/openai-mock-server.ts &
      - run: npm run test:e2e -- --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: contractiq/playwright-report }

  # AI evals on PRs that touch AI, PDF or eval code (15-evals.md §6.11): replay the full set (free), then a
  # live smoke run and the live chat set. Stale recordings only warn here because the live steps cover them.
  eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    env:
      HAS_EVAL_DATA: ${{ secrets.EVAL_DATA_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Only when AI, PDF or eval code changed
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^contractiq/(src/lib/ai/|src/lib/pdf/|evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA != 'true'
        run: echo "::warning::Skipping evals — EVAL_DATA_DEPLOY_KEY is not set (contractiq-eval-data is not set up yet; see evals/README.md)"
      - if: steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA == 'true'
        name: Check out the eval dataset (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/contractiq-eval-data
          ssh-key: ${{ secrets.EVAL_DATA_DEPLOY_KEY }}
          path: contractiq/evals/datasets
      - if: steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA == 'true'
        uses: actions/setup-node@v4
        with: { node-version-file: contractiq/.nvmrc, cache: npm, cache-dependency-path: contractiq/package-lock.json }
      - if: steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA == 'true'
        name: Extraction — replay, full set (deterministic, free)
        run: npm run eval:extraction -- --replay --subset full --gate --allow-replay-misses --out evals/reports/1-replay-full
      - if: steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA == 'true'
        name: Extraction — live smoke
        run: npm run eval:extraction -- --live --subset smoke --stage beta --gate --out evals/reports/2-live-smoke
        env: { OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY_EVAL }}' }
      - if: steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA == 'true'
        name: Chat groundedness — live
        run: npm run eval:chat -- --live --gate --out evals/reports/3-chat
        env: { OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY_EVAL }}' }
      - if: always() && steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA == 'true'
        name: Combine summaries
        run: cat evals/reports/*/summary.md > evals/reports/pr-comment.md 2>/dev/null || echo "Evals did not produce a summary — see the job log." > evals/reports/pr-comment.md
      - if: always() && steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA == 'true'
        uses: actions/upload-artifact@v4
        with: { name: eval-reports, path: contractiq/evals/reports/, retention-days: 30 }
      - if: always() && steps.changed.outputs.run == 'true' && env.HAS_EVAL_DATA == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with: { header: ai-evals, path: contractiq/evals/reports/pr-comment.md }

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PROCESSING_MODE: sync
      OPENAI_BASE_URL: http://localhost:4010/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: contractiq/.nvmrc, cache: npm, cache-dependency-path: contractiq/package-lock.json }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        # Keep equal to the `supabase` devDependency in package-lock.json: npm scripts (db:types) run that copy,
        # and `gen types` output changes between releases. To upgrade, bump both and re-run npm run db:types.
        with: { version: 2.120.0 }
      - run: supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor
      - name: Export local Supabase env
        run: |
          supabase status -o env >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - name: Map Supabase keys
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps firefox chromium
      - name: Start OpenAI mock server
        run: npx tsx tests/mocks/openai-mock-server.ts &
      - run: npm run test:e2e -- --project=firefox --project=mobile-chrome
